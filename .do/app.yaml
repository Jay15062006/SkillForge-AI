name: skillforge-ai
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      branch: main
      deploy_on_push: true
      repo: Jay15062006/skillforge-ai
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: INFERENCE_PROVIDER_NAME
        value: backboard
      - key: INFERENCE_BASE_URL
        value: https://app.backboard.io/api
      - key: INFERENCE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: INFERENCE_MODEL
        value: meta-llama/llama-3.1-8b-instruct
